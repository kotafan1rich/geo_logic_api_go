version: '3'

vars:
  APP_NAME: geo_logic_api
  GO_VERSION: '1.27'
  GOLANGCI_LINT_VERSION: 'v2.8.0'
  GCI_VERSION: 'v0.13.7'
  GOFUMPT_VERSION: 'v0.9.2'

  BIN_DIR: '{{.ROOT_DIR}}/bin'
  GOLANGCI_LINT: '{{.BIN_DIR}}/golangci-lint'
  GCI: '{{.BIN_DIR}}/gci'
  GOFUMPT: '{{.BIN_DIR}}/gofumpt'

tasks:
  db:up:
    desc: "Запустить PostGIS через Docker Compose"
    cmds:
      - docker compose up -d db

  db:down:
    desc: "Остановить PostGIS и очистить volumes"
    cmds:
      - docker compose down -v

  app:up:
    desc: "Запустить всё окружение (API + DB) в контейнерах"
    cmds:
      - docker compose up -d --build

  logs:
    desc: "Просмотр логов всех контейнеров"
    cmds:
      - docker compose logs -f

  run:
    desc: "Локальный запуск Go-приложения"
    cmds:
      - go run cmd/server/main.go

  build:
    desc: "Сборка бинарника Go"
    cmds:
      - go build -o bin/{{.APP_NAME}} cmd/server/main.go

  install-formatters:
    desc: "Устанавливает форматтеры gci и gofumpt в ./bin"
    cmds:
      - |
        [ -f {{.GOFUMPT}} ] || {
          echo '📦 Устанавливаем gofumpt {{.GOFUMPT_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}
        }
        [ -f {{.GCI}} ] || {
          echo '📦 Устанавливаем gci {{.GCI_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install github.com/daixiang0/gci@{{.GCI_VERSION}}
        }
    status:
      - test -x {{.GOFUMPT}}
      - test -x {{.GCI}}

  format:
    desc: "Форматирует весь проект gofumpt + gci автоисправлением"
    deps: [ install-formatters, install-golangci-lint ]
    cmds:
      - |
        echo "🧼 Форматируем через gofumpt ..."
        find . -type f -name '*.go' ! -path '*/mocks/*' -exec {{.GOFUMPT}} -extra -w {} +
      - |
        echo "🗂️ Автоматически выравниваем импорты (gci) под конфиг линтера ..."
        {{.GOLANGCI_LINT}} run ./... --config=.golangci.yaml --fix
  
  install-golangci-lint:
    desc: "Устанавливает golangci-lint в каталог bin"
    cmds:
      - |
        [ -f {{.GOLANGCI_LINT}} ] || {
          mkdir -p {{.BIN_DIR}}
          echo "📦 Устанавливаем golangci-lint {{.GOLANGCI_LINT_VERSION}}..."
          GOBIN={{.BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
        }
    status:
      - test -x {{.GOLANGCI_LINT}}

  lint:
    desc: "Запускает golangci-lint для всех модулей"
    deps: [ install-golangci-lint ]
    cmds:
      - '{{.GOLANGCI_LINT}} run ./... --config=.golangci.yaml'

  tests:
    desc: "Запускает все тесты"
    cmds:
      - go test ./internal/... -v

  e2e_tests:
    desc: "Запускает E2E тесты API с автоматическим контролем контейнера базы"
    cmds:
      - go test ./internal/tests/e2e/... -v -tags=e2e
  
  ci:
    desc: "Запуск всех проверок CI (форматирование, линтер, тесты)"
    deps: [format, lint, e2e_tests]
    cmds:
      - echo "🎉 All CI checks passed successfully!"
