openapi: 3.0.3
info:
  title: GeoLogic API
  description: REST API для управления пользователями и объектами аренды с геопространственным поиском.
  version: 0.2.0

servers:
  - url: /api
    description: Current API base path

paths:
  /users:
    post:
      summary: Create user
      operationId: createUser
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation error in the request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{id}:
    get:
      summary: Get user by ID
      operationId: getUserById
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          description: Internal user ID
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Successful response with user data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found
        '400':
          description: Validation error in the request body

    patch:
      summary: Update user
      operationId: updateUser
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          description: Internal user ID
          schema:
            type: integer
            format: int64
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User data updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation error in the request

    delete:
      summary: Delete user
      operationId: deleteUser
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          description: Internal user ID
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '204':
          description: User deleted successfully (no response body)
        '404':
          description: User not found
        '400':
          description: Validation error in the request parameters

  /rents:
    post:
      summary: Create rents
      operationId: createRents
      tags:
        - Rents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRentRequest'
      responses:
        '201':
          description: Rents created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentResponse'
        '400':
          description: Validation error in the request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict error when trying to create a rents that already exists

  /rents/available:
    get:
      summary: Get available rents in the specified area
      operationId: getAvailableRents
      tags:
        - Rents
      parameters:
        - name: lat
          in: query
          required: true
          description: Latitude of the center point for searching available rents
          schema:
            type: number
            format: float
            example: 37.7749
        - name: long
          in: query
          required: true
          description: Longitude of the center point for searching available rents
          schema:
            type: number
            format: float
            example: -122.4194
        - name: radius
          in: query
          required: false
          description: Search radius in metrs (default is 5 km)
          schema:
            type: number
            format: int
            example: 500
      responses:
        '200':
          description: Successful response with a list of available rents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RentResponse'
        '400':
          description: Validation error in the request parameters

  /rents/{id}:
    get:
      summary: Get rent by ID
      operationId: getRentById
      tags:
        - Rents
      parameters:
        - name: id
          in: path
          required: true
          description: Internal rent ID
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Successful response with rent data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentResponse'
        '404':
          description: Rent not found  
        '400':
          description: Validation error in the request parameters
    patch:
      summary: Update rent
      operationId: updateRent
      tags:
        - Rents
      parameters:
        - name: id
          in: path
          required: true
          description: Internal rent ID
          schema:
            type: integer
            format: int64
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRentRequest'
      responses:
        '200':
          description: Rent data updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentResponse'
        '400':
          description: Validation error in the request parameters  
        '404':
          description: Rent not found
        '409':
          description: Conflict error when trying to update a rents that already exists with the same coordinates

    delete:
      summary: Delete rent
      operationId: deleteRent
      tags:
        - Rents
      parameters:
        - name: id
          in: path
          required: true
          description: Internal rent ID
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '204':
          description: Rent deleted successfully (no response body)
        '404':
          description: Rent not found  
        '400':
          description: Validation error in the request parameters

components:
  schemas:
    CreateUserRequest:
      type: object
      required:
        - tg_id
      properties:
        tg_id:
          type: integer
          format: int64
          minimum: 1
          example: 123456789
          description: User's Telegram ID (must be greater than 0)

    UpdateUserRequest:
      type: object
      required:
        - tg_id
      properties:
        tg_id:
          type: integer
          format: int64
          minimum: 1
          example: 987654321
          description: New Telegram ID of the user (must be greater than 0)

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
          description: Internal user ID
        tg_id:
          type: integer
          format: int64
          example: 123456789
          description: User's Telegram ID
    
    CreateRentRequest:
      type: object
      required:
        - lat
        - long
        - address
      properties:
        lat:
          type: number
          format: float
          example: 37.7749
          description: Latitude of rents location
        long:
          type: number
          format: float
          example: -122.4194
          description: Longitude of rents location
        address:
          type: string
          example: "190000, Санкт-Петербург, Невский проспект, д. 1, кв. 15"
          description: Address of rents
        info:
          type: string
          example: "Additional information about the rents"
          description: Additional information about the rents

    RentResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
          description: Internal rents ID
        lat:
          type: number
          format: float
          example: 37.7749
          description: Latitude of rents location
        long:
          type: number
          format: float
          example: -122.4194
          description: Longitude of rents location
        address:
          type: string
          example: "190000, Санкт-Петербург, Невский проспект, д. 1, кв. 15"
          description: Address of rents
        info:
          type: string
          example: "Additional information about the rents"
          description: Additional information about the rents

    UpdateRentRequest:
      type: object
      properties:
        lat:
          type: number
          format: float
          example: 37.7749
          description: New latitude of rents location
        long:
          type: number
          format: float
          example: -122.4194
          description: New longitude of rents location
        address:
          type: string
          example: "190000, Санкт-Петербург, Невский проспект, д. 1, кв. 15"
          description: New address of rents
        info:
          type: string
          example: "Updated additional information about the rents"
          description: Updated additional information about the rents

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Key: 'CreateUserRequest.TgID' Error:Field validation for 'TgID' failed on the 'required' tag"
