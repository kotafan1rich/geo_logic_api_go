openapi: 3.0.3
info:
  title: GeoLogic API
  description: REST API для управления пользователями и объектами аренды с геопространственным поиском.
  version: 0.2.0

servers:
  - url: /api
    description: Current API base path

paths:
  /users:
    post:
      summary: Create user
      operationId: createUser
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation error in the request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{id}:
    get:
      summary: Get user by ID
      operationId: getUserById
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          description: Internal user ID
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Successful response with user data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found
        '400':
          description: Validation error in the request body

    patch:
      summary: Update user
      operationId: updateUser
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          description: Internal user ID
          schema:
            type: integer
            format: int64
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User data updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation error in the request

    delete:
      summary: Delete user
      operationId: deleteUser
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          description: Internal user ID
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '204':
          description: User deleted successfully (no response body)
        '404':
          description: User not found
        '400':
          description: Validation error in the request parameters

  /events:
    post:
      summary: Create event
      operationId: createEvent
      tags:
        - Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: Event created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          description: Validation error in the request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict error when trying to create an event that already exists

  /events/near:
    get:
      summary: Get events in the specified area filtered by date
      operationId: getEventsNear
      tags:
        - Events
      parameters:
        - name: lat
          in: query
          required: true
          description: Latitude of the center point for searching events
          schema:
            type: number
            format: float
            example: 37.7749
        - name: long
          in: query
          required: true
          description: Longitude of the center point for searching events
          schema:
            type: number
            format: float
            example: -122.4194
        - name: radius
          in: query
          required: false
          description: Search radius in meters (default is 5 km)
          schema:
            type: number
            format: int
            example: 5000
        - name: date
          in: query
          required: false
          description: Date filter for events
          schema:
            type: string
            format: date-time
            example: 2026-07-13T12:00:00Z
      responses:
        '200':
          description: Successful response with a list of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventResponse'
        '400':
          description: Validation error in the request parameters

  /events/{id}:
    get:
      summary: Get event by ID
      operationId: getEventById
      tags:
        - Events
      parameters:
        - name: id
          in: path
          required: true
          description: Internal event ID
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Successful response with event data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '404':
          description: Event not found
        '400':
          description: Validation error in the request parameters
    patch:
      summary: Update event
      operationId: updateEvent
      tags:
        - Events
      parameters:
        - name: id
          in: path
          required: true
          description: Internal event ID
          schema:
            type: integer
            format: int64
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRequest'
      responses:
        '200':
          description: Event data updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          description: Validation error in the request parameters
        '404':
          description: Event not found
    delete:
      summary: Delete event
      operationId: deleteEvent
      tags:
        - Events
      parameters:
        - name: id
          in: path
          required: true
          description: Internal event ID
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '204':
          description: Event deleted successfully (no response body)
        '404':
          description: Event not found
        '400':
          description: Validation error in the request parameters

  /infra:
    post:
      summary: Create infra
      operationId: createInfrastructure
      tags:
        - Infrastructure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInfrastructureRequest'
      responses:
        '201':
          description: Infrastructure created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfrastructureResponse'
        '400':
          description: Validation error in the request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict error when trying to create infra that already exists

  /infra/near:
    get:
      summary: Get infra in the specified area
      operationId: getInfrastructureNear
      tags:
        - Infrastructure
      parameters:
        - name: lat
          in: query
          required: true
          description: Latitude of the center point for searching infra
          schema:
            type: number
            format: float
            example: 37.7749
        - name: long
          in: query
          required: true
          description: Longitude of the center point for searching infra
          schema:
            type: number
            format: float
            example: -122.4194
        - name: radius
          in: query
          required: false
          description: Search radius in meters (default is 5 km)
          schema:
            type: number
            format: int
            example: 5000
      responses:
        '200':
          description: Successful response with a list of infra objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InfrastructureResponse'
        '400':
          description: Validation error in the request parameters

  /infra/{id}:
    get:
      summary: Get infra by ID
      operationId: getInfrastructureById
      tags:
        - Infrastructure
      parameters:
        - name: id
          in: path
          required: true
          description: Internal infra ID
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Successful response with infra data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfrastructureResponse'
        '404':
          description: Infrastructure not found
        '400':
          description: Validation error in the request parameters
    patch:
      summary: Update infra
      operationId: updateInfrastructure
      tags:
        - Infrastructure
      parameters:
        - name: id
          in: path
          required: true
          description: Internal infra ID
          schema:
            type: integer
            format: int64
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInfrastructureRequest'
      responses:
        '200':
          description: Infrastructure data updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfrastructureResponse'
        '400':
          description: Validation error in the request parameters
        '404':
          description: Infrastructure not found
    delete:
      summary: Delete infra
      operationId: deleteInfrastructure
      tags:
        - Infrastructure
      parameters:
        - name: id
          in: path
          required: true
          description: Internal infra ID
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '204':
          description: Infrastructure deleted successfully (no response body)
        '404':
          description: Infrastructure not found
        '400':
          description: Validation error in the request parameters

  /infra/types:
    post:
      summary: Create infra type
      operationId: createInfrastructureType
      tags:
        - InfrastructureType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInfrastructureTypeRequest'
      responses:
        '201':
          description: Infrastructure type created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfrastructureTypeResponse'
        '400':
          description: Validation error in the request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict error when trying to create an infra type that already exists

  /infra/types/{id}:
    get:
      summary: Get infra type by ID
      operationId: getInfrastructureTypeById
      tags:
        - InfrastructureType
      parameters:
        - name: id
          in: path
          required: true
          description: Internal infra type ID
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Successful response with infra type data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfrastructureTypeResponse'
        '404':
          description: Infrastructure type not found
        '400':
          description: Validation error in the request parameters
    patch:
      summary: Update infra type
      operationId: updateInfrastructureType
      tags:
        - InfrastructureType
      parameters:
        - name: id
          in: path
          required: true
          description: Internal infra type ID
          schema:
            type: integer
            format: int64
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInfrastructureTypeRequest'
      responses:
        '200':
          description: Infrastructure type updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfrastructureTypeResponse'
        '400':
          description: Validation error in the request parameters
        '404':
          description: Infrastructure type not found
    delete:
      summary: Delete infra type
      operationId: deleteInfrastructureType
      tags:
        - InfrastructureType
      parameters:
        - name: id
          in: path
          required: true
          description: Internal infra type ID
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '204':
          description: Infrastructure type deleted successfully (no response body)
        '404':
          description: Infrastructure type not found
        '400':
          description: Validation error in the request parameters

  /users/{id}/locations:
    get:
      summary: Get all locations of a user
      operationId: getUserLocations
      tags:
        - Users Locations
      parameters:
        - name: id
          in: path
          required: true
          description: Internal user ID
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Successful response with user locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserLocationResponse'
        '404':
          description: User not found
        '400':
          description: Validation error in the request parameters
    post:
      summary: Add a location to a user
      operationId: addUserLocation
      tags:
        - Users Locations
      parameters:
        - name: id
          in: path
          required: true
          description: Internal user ID
          schema:
            type: integer
            format: int64
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserLocationRequest'
      responses:
        '201':
          description: User location created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLocationResponse'
        '400':
          description: Validation error in the request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{id}/locations/{locationId}:
    patch:
      summary: Update a user location relation
      operationId: updateUserLocation
      tags:
        - Users Locations
      parameters:
        - name: id
          in: path
          required: true
          description: Internal user ID
          schema:
            type: integer
            format: int64
            example: 1
        - name: locationId
          in: path
          required: true
          description: Internal user-location relation ID
          schema:
            type: integer
            format: int64
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserLocationRequest'
      responses:
        '200':
          description: User location updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLocationResponse'
        '400':
          description: Validation error in the request parameters
        '404':
          description: User location relation not found
    delete:
      summary: Delete a user location relation
      operationId: deleteUserLocation
      tags:
        - Users Locations
      parameters:
        - name: id
          in: path
          required: true
          description: Internal user ID
          schema:
            type: integer
            format: int64
            example: 1
        - name: locationId
          in: path
          required: true
          description: Internal user-location relation ID
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '204':
          description: User location relation deleted successfully (no response body)
        '404':
          description: User location relation not found
        '400':
          description: Validation error in the request parameters

  /rents:
    post:
      summary: Create rents
      operationId: createRents
      tags:
        - Rents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRentRequest'
      responses:
        '201':
          description: Rents created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentResponse'
        '400':
          description: Validation error in the request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict error when trying to create a rents that already exists

  /rents/available:
    get:
      summary: Get available rents in the specified area
      operationId: getAvailableRents
      tags:
        - Rents
      parameters:
        - name: lat
          in: query
          required: true
          description: Latitude of the center point for searching available rents
          schema:
            type: number
            format: float
            example: 37.7749
        - name: long
          in: query
          required: true
          description: Longitude of the center point for searching available rents
          schema:
            type: number
            format: float
            example: -122.4194
        - name: radius
          in: query
          required: false
          description: Search radius in metrs (default is 5 km)
          schema:
            type: number
            format: int
            example: 500
      responses:
        '200':
          description: Successful response with a list of available rents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RentResponse'
        '400':
          description: Validation error in the request parameters

  /rents/{id}:
    get:
      summary: Get rent by ID
      operationId: getRentById
      tags:
        - Rents
      parameters:
        - name: id
          in: path
          required: true
          description: Internal rent ID
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Successful response with rent data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentResponse'
        '404':
          description: Rent not found  
        '400':
          description: Validation error in the request parameters
    patch:
      summary: Update rent
      operationId: updateRent
      tags:
        - Rents
      parameters:
        - name: id
          in: path
          required: true
          description: Internal rent ID
          schema:
            type: integer
            format: int64
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRentRequest'
      responses:
        '200':
          description: Rent data updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentResponse'
        '400':
          description: Validation error in the request parameters  
        '404':
          description: Rent not found
        '409':
          description: Conflict error when trying to update a rents that already exists with the same coordinates

    delete:
      summary: Delete rent
      operationId: deleteRent
      tags:
        - Rents
      parameters:
        - name: id
          in: path
          required: true
          description: Internal rent ID
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '204':
          description: Rent deleted successfully (no response body)
        '404':
          description: Rent not found  
        '400':
          description: Validation error in the request parameters

components:
  schemas:
    CreateUserRequest:
      type: object
      required:
        - tg_id
      properties:
        tg_id:
          type: integer
          format: int64
          minimum: 1
          example: 123456789
          description: User's Telegram ID (must be greater than 0)

    UpdateUserRequest:
      type: object
      required:
        - tg_id
      properties:
        tg_id:
          type: integer
          format: int64
          minimum: 1
          example: 987654321
          description: New Telegram ID of the user (must be greater than 0)

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
          description: Internal user ID
        tg_id:
          type: integer
          format: int64
          example: 123456789
          description: User's Telegram ID
    
    CreateRentRequest:
      type: object
      required:
        - lat
        - long
        - address
      properties:
        lat:
          type: number
          format: float
          example: 37.7749
          description: Latitude of rents location
        long:
          type: number
          format: float
          example: -122.4194
          description: Longitude of rents location
        address:
          type: string
          example: "190000, Санкт-Петербург, Невский проспект, д. 1, кв. 15"
          description: Address of rents
        info:
          type: string
          example: "Additional information about the rents"
          description: Additional information about the rents

    RentResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
          description: Internal rents ID
        lat:
          type: number
          format: float
          example: 37.7749
          description: Latitude of rents location
        long:
          type: number
          format: float
          example: -122.4194
          description: Longitude of rents location
        address:
          type: string
          example: "190000, Санкт-Петербург, Невский проспект, д. 1, кв. 15"
          description: Address of rents
        info:
          type: string
          example: "Additional information about the rents"
          description: Additional information about the rents

    UpdateRentRequest:
      type: object
      properties:
        lat:
          type: number
          format: float
          example: 37.7749
          description: New latitude of rents location
        long:
          type: number
          format: float
          example: -122.4194
          description: New longitude of rents location
        address:
          type: string
          example: "190000, Санкт-Петербург, Невский проспект, д. 1, кв. 15"
          description: New address of rents
        info:
          type: string
          example: "Updated additional information about the rents"
          description: Updated additional information about the rents

    CreateEventRequest:
      type: object
      required:
        - lat
        - long
        - address
        - date
      properties:
        lat:
          type: number
          format: float
          example: 37.7749
          description: Latitude of the event location
        long:
          type: number
          format: float
          example: -122.4194
          description: Longitude of the event location
        address:
          type: string
          example: "190000, Санкт-Петербург, Невский проспект, д. 1"
          description: Address of the event
        date:
          type: string
          format: date-time
          example: "2026-07-13T12:00:00Z"
          description: Date and time of the event
        info:
          type: string
          example: "Additional information about the event"
          description: Additional information about the event

    UpdateEventRequest:
      type: object
      properties:
        lat:
          type: number
          format: float
          example: 37.7749
          description: New latitude of the event location
        long:
          type: number
          format: float
          example: -122.4194
          description: New longitude of the event location
        address:
          type: string
          example: "190000, Санкт-Петербург, Невский проспект, д. 1"
          description: New address of the event
        date:
          type: string
          format: date-time
          example: "2026-07-13T12:30:00Z"
          description: New date and time of the event
        info:
          type: string
          example: "Updated additional information about the event"
          description: Updated additional information about the event

    EventResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
          description: Internal event ID
        lat:
          type: number
          format: float
          example: 37.7749
          description: Latitude of the event location
        long:
          type: number
          format: float
          example: -122.4194
          description: Longitude of the event location
        address:
          type: string
          example: "190000, Санкт-Петербург, Невский проспект, д. 1"
          description: Address of the event
        date:
          type: string
          format: date-time
          example: "2026-07-13T12:00:00Z"
          description: Date and time of the event
        info:
          type: string
          example: "Additional information about the event"
          description: Additional information about the event

    CreateInfrastructureRequest:
      type: object
      required:
        - lat
        - long
        - address
        - type
      properties:
        lat:
          type: number
          format: float
          example: 37.7749
          description: Latitude of the infra location
        long:
          type: number
          format: float
          example: -122.4194
          description: Longitude of the infra location
        address:
          type: string
          example: "190000, Санкт-Петербург, Невский проспект, д. 2"
          description: Address of the infra object
        type:
          type: string
          example: "shop"
          description: Type of infra entity
        info:
          type: string
          example: "Additional information about the infra"
          description: Additional information about the infra

    UpdateInfrastructureRequest:
      type: object
      properties:
        lat:
          type: number
          format: float
          example: 37.7749
          description: New latitude of the infra location
        long:
          type: number
          format: float
          example: -122.4194
          description: New longitude of the infra location
        address:
          type: string
          example: "190000, Санкт-Петербург, Невский проспект, д. 2"
          description: New address of the infra object
        type:
          type: string
          example: "cafe"
          description: New type of infra entity
        info:
          type: string
          example: "Updated additional information about the infra"
          description: Updated additional information about the infra

    InfrastructureResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
          description: Internal infra ID
        lat:
          type: number
          format: float
          example: 37.7749
          description: Latitude of the infra location
        long:
          type: number
          format: float
          example: -122.4194
          description: Longitude of the infra location
        address:
          type: string
          example: "190000, Санкт-Петербург, Невский проспект, д. 2"
          description: Address of the infra object
        type:
          type: string
          example: "shop"
          description: Type of infra entity
        info:
          type: string
          example: "Additional information about the infra"
          description: Additional information about the infra

    CreateUserLocationRequest:
      type: object
      required:
        - location_id
      properties:
        location_id:
